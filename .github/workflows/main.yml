name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_PROJECT_ID: ppxfvwxhzklwoqboejgr
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBweGZ2d3hoemtsd29xYm9lamdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjkxMzUsImV4cCI6MjA5MTg0NTEzNX0.QyFgzNQCveBwDb9O-jOIqfJbF9os4wnGQNg0pgGCvlQ
          VITE_SUPABASE_URL: https://ppxfvwxhzklwoqboejgr.supabase.co
        run: bun run build

      - name: SPA fallback (copy index.html to 404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
